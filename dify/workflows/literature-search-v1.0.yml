app:
  description: 根据用户输入的研究主题自动检索真实学术文献，完成文献去重、相关性筛选和优先级排序，将高质量文献及其 DOI、作者、期刊、摘要和原文链接同步至
    Zotero，并进一步结合摘要或全文进行结构化精读，提炼研究问题、研究方法、实验设计、核心结果、创新点与局限性，最终支持多篇文献对比、研究现状梳理和 Research
    Gap 分析。
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: AI 学术文献检索与精读助手v1.0
  use_icon_as_answer_icon: false
