      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |-
          import json


          def main(body: str):
              data = json.loads(body)

              if not isinstance(data, dict):
                  raise ValueError("LitWatch response must be a JSON object")

              query = data.get("query")
              paper_count = data.get("paper_count")
              papers = data.get("papers")

              if not isinstance(query, str):
                  raise ValueError("LitWatch response query must be a string")
              if not isinstance(paper_count, int):
                  raise ValueError("LitWatch response paper_count must be an integer")
              if not isinstance(papers, list):
                  raise ValueError("LitWatch response papers must be a list")
              if paper_count != len(papers):
                  raise ValueError("LitWatch response paper_count does not match papers")

              return {
                  "paper_count": paper_count,
                  "papers_json": json.dumps(
                      papers,
                      ensure_ascii=False,
                      indent=2,
                  ),
              }
        code_language: python3
        outputs:
          paper_count:
            children: null
            type: number
          papers_json:
            children: null
            type: string
        selected: false
        title: 解析 LitWatch 响应
        type: code
        variables:
