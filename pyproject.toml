[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litwatch"
version = "0.1.0"
description = "A multi-source literature radar with deterministic ranking, optional AI analysis, web dashboard, email digests, and Zotero export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "tzdata>=2024.1,<2027; platform_system == 'Windows'",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-httpx>=0.30,<1", "ruff>=0.6,<1"]
semantic = ["numpy>=1.26,<3", "sentence-transformers>=3.0,<4"]

[project.scripts]
litwatch = "litwatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/litwatch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
