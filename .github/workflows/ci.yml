name: ci

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

permissions:
  contents: read

jobs:
  linux-core:
    name: Linux core CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -m "not windows"

  windows-lifecycle:
    name: Windows lifecycle CI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -m windows

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
